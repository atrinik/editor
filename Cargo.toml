[workspace]
members = [
  "crates/tilewright-editor-app",
  "crates/tilewright-editor-commands",
  "crates/tilewright-editor-document",
  "crates/tilewright-editor-preview",
  "crates/tilewright-editor-project",
  "crates/tilewright-editor-testkit",
  "crates/tilewright-editor-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/seraphinastudios/tilewright-editor"

[workspace.dependencies]
tilewright-editor-commands = { path = "crates/tilewright-editor-commands", version = "=0.1.0" }
tilewright-editor-document = { path = "crates/tilewright-editor-document", version = "=0.1.0" }
tilewright-editor-preview = { path = "crates/tilewright-editor-preview", version = "=0.1.0" }
tilewright-editor-project = { path = "crates/tilewright-editor-project", version = "=0.1.0" }
tilewright-editor-testkit = { path = "crates/tilewright-editor-testkit", version = "=0.1.0" }
tilewright-editor-ui = { path = "crates/tilewright-editor-ui", version = "=0.1.0" }
tilewright-edit = "=0.1.0"
tilewright-jsonc = "=0.1.0"
tilewright-render-api = "=0.3.0"
tilewright-render-resources = "=0.3.0"
tilewright-render-testkit = "=0.3.0"
tilewright-render-wgpu = "=0.3.0"
tilewright-render-world = "=0.3.0"
tilewright-scene = "=0.3.0"
tilewright-source = "=0.1.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wayland", "wgpu_no_default_features", "x11"] }
egui = { version = "0.37.0", default-features = false, features = ["default_fonts"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
# The window loads its Wayland libraries at run time, so builds need no
# Wayland development headers.
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
