[workspace]
members = [
  "crates/atrinik-editor-app",
  "crates/atrinik-editor-commands",
  "crates/atrinik-editor-document",
  "crates/atrinik-editor-preview",
  "crates/atrinik-editor-project",
  "crates/atrinik-editor-testkit",
  "crates/atrinik-editor-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/atrinik/editor"

[workspace.dependencies]
atrinik-editor-commands = { path = "crates/atrinik-editor-commands", version = "=0.1.0" }
atrinik-editor-document = { path = "crates/atrinik-editor-document", version = "=0.1.0" }
atrinik-editor-preview = { path = "crates/atrinik-editor-preview", version = "=0.1.0" }
atrinik-editor-project = { path = "crates/atrinik-editor-project", version = "=0.1.0" }
atrinik-editor-testkit = { path = "crates/atrinik-editor-testkit", version = "=0.1.0" }
atrinik-editor-ui = { path = "crates/atrinik-editor-ui", version = "=0.1.0" }
atrinik-render-api = { git = "https://github.com/atrinik/renderer", rev = "3a6bbeabc2b7eac8d162d758732a0495fe8a9dd9", version = "=0.1.0" }
atrinik-render-resources = { git = "https://github.com/atrinik/renderer", rev = "3a6bbeabc2b7eac8d162d758732a0495fe8a9dd9", version = "=0.1.0" }
atrinik-render-testkit = { git = "https://github.com/atrinik/renderer", rev = "3a6bbeabc2b7eac8d162d758732a0495fe8a9dd9", version = "=0.1.0" }
atrinik-scene = { git = "https://github.com/atrinik/renderer", rev = "3a6bbeabc2b7eac8d162d758732a0495fe8a9dd9", version = "=0.1.0" }
atrinik-source = { git = "https://github.com/atrinik/content-toolkit", rev = "b2178d442af5d897a45619c200fec5ceb39fc3cf", version = "=0.1.0" }
atrinik-transaction = { git = "https://github.com/atrinik/content-toolkit", rev = "b2178d442af5d897a45619c200fec5ceb39fc3cf", version = "=0.1.0" }
sdl3 = { version = "=0.18.4", default-features = false, features = ["build-from-source-static"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
