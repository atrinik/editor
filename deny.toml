[graph]
all-features = true

[advisories]
yanked = "deny"
# Temporary: ttf-parser is unmaintained and arrives only through renderer
# =0.6.2 (cosmic-text 0.19 -> fontdb 0.23 -> ttf-parser 0.25). Ignore this one
# advisory and nothing else. Remove this entry when the renderer cohort that
# drops cosmic-text/fontdb/ttf-parser ships and the editor moves to it.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "temporary: unmaintained ttf-parser via renderer 0.6.2 cosmic-text/fontdb; remove when the renderer cohort that drops cosmic-text/fontdb/ttf-parser ships and the editor moves to it" },
]

[licenses]
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0", "Zlib"]
# Font data only; never allow OFL for arbitrary packages or future UI versions.
# cargo-deny 0.20.2 PackageSpecs uses @ for an exact version.
exceptions = [{ crate = "tilewright-render-ui@0.6.2", allow = ["OFL-1.1"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
  { name = "reqwest" },
  { name = "tokio" },
  { name = "quinn" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
