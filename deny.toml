[graph]
all-features = true
# The platforms the editor is built and packaged for. The window's
# dependencies carry WebAssembly-only crates that these never build.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "Zlib"]
# Narrow exceptions, each for one crate of the window's dependency graph;
# THIRD_PARTY_NOTICES.md carries their notices.
exceptions = [
  # The fonts egui draws its text with: Hack, Ubuntu-Light and Noto Emoji.
  { allow = ["OFL-1.1", "Ubuntu-font-1.0"], crate = "epaint_default_fonts" },
  # Loads the platform's graphics and windowing libraries at run time.
  { allow = ["ISC"], crate = "libloading" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
  { name = "reqwest" },
  { name = "tokio" },
  { name = "quinn" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
